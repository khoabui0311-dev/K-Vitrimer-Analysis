name: Project checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-audit.txt
      - run: python -m pip check
      - run: python -m flake8 can_relax tests --select=E9,F63,F7,F82 --jobs=1
      - run: python -m bandit -r can_relax -ll
      - run: python -m pytest -q --tb=short
