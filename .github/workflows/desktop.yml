name: Build Windows desktop installer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m venv .venv
      - run: .\.venv\Scripts\python.exe -m pip install -r requirements-build.txt
      - run: choco install innosetup --version=6.7.3 --no-progress -y
      - run: .\desktop\build_windows.ps1
      - run: .\desktop\test_installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: K-Vitrimer-Analysis-Windows-x64
          path: |
            dist/K_Vitrimer_Analysis_Setup_*.exe
            dist/K_Vitrimer_Analysis_Setup_*.sha256
            dist/desktop-self-test.json
            dist/installed-self-test.json
          if-no-files-found: error
