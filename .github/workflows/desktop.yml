name: Build VitriFit Windows candidate
on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/vitrifit-2-release']
    paths:
      - 'can_relax/**'
      - 'desktop/**'
      - 'tests/**'
      - 'requirements*.txt'
      - 'CITATION.cff'
      - '.github/workflows/desktop.yml'
      - '.github/scripts/install_inno.ps1'
  pull_request:
    paths: ['can_relax/**', 'desktop/**', 'tests/**', 'requirements*.txt', 'CITATION.cff', '.github/workflows/desktop.yml', '.github/scripts/install_inno.ps1']
permissions:
  contents: read
jobs:
  windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m venv .venv
      - run: .\.venv\Scripts\python.exe -m pip install -r requirements-desktop-lock.txt
      - run: .\.venv\Scripts\python.exe -m pip check
      - run: .\.venv\Scripts\python.exe -m pytest -q --tb=short
      - run: .\.github\scripts\install_inno.ps1
      - run: .\desktop\build_windows.ps1
      - run: .\desktop\test_installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: VitriFit-Windows-x64-candidate
          path: |
            dist/VitriFit_Setup_*.exe
            dist/VitriFit_Setup_*.sha256
            dist/desktop-self-test.json
            dist/installed-self-test.json
            dist/release-manifest.json
            docs/QUICK_START.md
            docs/RELEASE_NOTES_2.0.md
          if-no-files-found: error
